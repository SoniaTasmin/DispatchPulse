services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP ping only succeeds after the init script finishes (init runs with networking disabled).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.1-management
    # RabbitMQ stores data per node name, which is derived from the hostname. A fixed
    # hostname keeps queues and messages across container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Health checks run as root with HOME=/var/lib/rabbitmq. If the CLI ran before the broker
      # created its Erlang cookie, it would create a root-owned cookie the broker cannot read.
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  rabbitmq-data:

global:
  # Short intervals so local demos react within seconds; 15-60s is typical in production.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:3000']
  - job_name: notification-worker
    static_configs:
      - targets: ['notification-worker:3001']
